# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Catherine C. Osborn, MS, MA"                                # Your name
  description: "Catherine C. Osborn is a Bioinformatics Research Associate at Case Western Reserve University"   # A brief slogan (optional)
  image: img/cosborn.jpeg
  
  favicon: img/favicon-16.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/favicon-512.png
    
    # your sub-pages
    left:
      - text: "CV"
        href: cv/index.qmd
    
    # your social media handles
    right:
      - icon: link
        href: https://prchn.org/
      - icon: link
        href: https://orcid.org/0000-0001-6162-7315
      - icon: envelope
        aria-label: email
        href: "mailto:catherine.osborn@case.edu"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true